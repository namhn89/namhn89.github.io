<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Hanoi | Nam Nguyen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="shortcut icon" href="../assets/img/foto/nam.png" type="image/x-png" />

<body>
  <nav class="gal-nav">
    <a href="../index.html#gallery"><i class="fas fa-arrow-left"></i> Back</a>
    <span class="sep">|</span>
    <span class="city">Hanoi</span>

    </div>
    <div class="masonry-item" data-idx="4">
      <div class="ph-slot"><i class="fas fa-image"></i><span>Photo 5</span></div>
      <div class="overlay"><i class="fas fa-expand"></i></div>

      <div class="overlay"><i class="fas fa-expand"></i></div>
    </div>
  </div>

  <script src="../assets/js/gallery.js"></script>
